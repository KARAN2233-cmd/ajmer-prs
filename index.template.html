<style>
:root{--teal:#0d4a44;--teal2:#16635b;--page:#f1f4f0;--ink:#16201f;--ink2:#586664;--line:#d9e1db;--ok:#1d7a46;--okBg:#dff1e6;--bad:#b3261e;--badBg:#fbe4e1;--warn:#8f5a00;--warnBg:#fbefcf;--hl:#f7e07a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--page);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:18px;line-height:1.5}
.card{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(13,74,68,.12);overflow:hidden}
.top{background:var(--teal);color:#fff;padding:20px 22px;display:flex;gap:14px;align-items:center}
.top img{width:46px;height:46px;background:#fff;border-radius:8px;padding:4px}
.top h1{font-size:19px;line-height:1.2}
.top p{font-size:13px;color:#b8d6cb}
.body{padding:22px}
label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
input{width:100%;font:inherit;padding:11px 13px;border:1.5px solid #c3cfc8;border-radius:8px;margin-bottom:16px;background:#fff}
input:focus{outline:0;border-color:#2a3fa8;box-shadow:0 0 0 3px rgba(42,63,168,.16)}
button{font:inherit;font-weight:600;width:100%;padding:12px;border-radius:8px;border:0;cursor:pointer;margin-bottom:10px}
button.primary{background:var(--teal);color:#fff}
button.primary:hover:not(:disabled){background:var(--teal2)}
button.ghost{background:#fff;border:1.5px solid #c3cfc8;color:var(--ink)}
button:disabled{opacity:.55;cursor:not-allowed}
.msg{border-radius:8px;padding:11px 13px;font-size:14px;margin-bottom:14px}
.msg.ok{background:var(--okBg);color:var(--ok)}
.msg.err{background:var(--badBg);color:var(--bad)}
.msg.info{background:var(--warnBg);color:var(--warn)}
.note{font-size:13px;color:var(--ink2);border-top:2px dashed var(--line);padding-top:14px;margin-top:6px}
.note b{color:var(--ink)}
[hidden]{display:none!important}
</style>
</head>

    <div><h1>Requisition notifications</h1><p>Ajmer Industries LLP</p></div>
  </div>
  <div class="body">
    <div id="msg" class="msg info" hidden></div>

    <label for="email">Notification email</label>
    <input id="email" type="email" list="mails" autocomplete="off" placeholder="info.ajmerind@gmail.com">
    <datalist id="mails"><option value="info.ajmerind@gmail.com"><option value="books.ajmerind@gmail.com"></datalist>

    <label for="code">Setup code</label>
    <input id="code" type="password" autocomplete="off" placeholder="Given by the admin">

    <button class="primary" id="enableBtn">Enable notifications on this device</button>
    <button class="ghost" id="testBtn">Send a test notification</button>

    <div class="note">
      <b>iPhone:</b> tap Share, then <b>Add to Home Screen</b>, and open this page from the new icon. Notifications do not work from a normal Safari tab.<br>
      <b>Android:</b> open in Chrome and tap Allow when asked.<br>
      Do this once on each phone or computer that should receive alerts.
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
/* Values are filled in by GitHub when the page is published (Secrets and Variables). Do not type them here. */
const FIREBASE_CONFIG = {
  apiKey: '__FIREBASE_API_KEY__',
  authDomain: '__FIREBASE_AUTH_DOMAIN__',
  projectId: '__FIREBASE_PROJECT_ID__',
  storageBucket: '__FIREBASE_STORAGE_BUCKET__',
  messagingSenderId: '__FIREBASE_MESSAGING_SENDER_ID__',
  appId: '__FIREBASE_APP_ID__'
};
const VAPID_KEY = '__VAPID_KEY__';
const GAS_URL   = '__GAS_URL__';   // Apps Script web app URL ending in /exec
/* ═══════════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const SAVE_KEY = 'prs_notify_v1';

function show(text, type) { const m = $('msg'); m.hidden = !text; m.textContent = text || ''; m.className = 'msg ' + (type || 'info'); }
const configured = () => ![JSON.stringify(FIREBASE_CONFIG), VAPID_KEY, GAS_URL].some(v => v.includes('__'));

function deviceName() {
  const ua = navigator.userAgent;
  const os = /iPhone|iPad/.test(ua) ? 'iPhone' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : 'Device';
  const br = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : /Firefox\//.test(ua) ? 'Firefox' : 'Browser';
  const pwa = ((window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone) ? ' app' : '';
  return os + ' ' + br + pwa;
}

async function gas(payload) {
  const r = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  return r.json();
}

let messaging = null;
async function getToken() {
  if (!(await firebase.messaging.isSupported())) {
    throw new Error('This browser cannot receive push notifications. On iPhone, add this page to the Home Screen first.');
  }
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  messaging = messaging || firebase.messaging();
  const reg = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
  await navigator.serviceWorker.ready;
  const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
  if (!token) throw new Error('Could not get a device token. Check that notifications are allowed for this site.');
  messaging.onMessage(p => {                       // page is open: show it ourselves
    const n = p.notification || {};
    reg.showNotification(n.title || 'Notification', { body: n.body || '', icon: 'icon-192.png' });
  });
  return token;
}

async function enable() {
  const email = $('email').value.trim().toLowerCase(), code = $('code').value;
  if (!email || !code) return show('Enter the notification email and the setup code.', 'err');
  if (!configured()) return show('This page is not configured yet. Paste the Firebase and Apps Script values at the top of index.html.', 'err');
  const btn = $('enableBtn'); btn.disabled = true; show('Working…', 'info');
  try {
    if (!('Notification' in window)) throw new Error('Notifications are not supported here. On iPhone, add this page to the Home Screen first.');
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error('Notifications are blocked. Allow them in the browser or phone settings for this site, then try again.');
    const token = await getToken();
    const res = await gas({ action: 'registerToken', email, code, token, device: deviceName() });
    if (!res.ok) throw new Error(res.message || 'Registration failed.');
    localStorage.setItem(SAVE_KEY, JSON.stringify({ email, code }));
    show('Done. This device will now receive notifications for ' + email + '.', 'ok');
  } catch (e) { show(e.message || String(e), 'err'); }
  finally { btn.disabled = false; }
}

async function test() {
  const email = $('email').value.trim().toLowerCase(), code = $('code').value;
  if (!email || !code) return show('Enter the notification email and the setup code.', 'err');
  const btn = $('testBtn'); btn.disabled = true; show('Sending…', 'info');
  try {
    const res = await gas({ action: 'test', email, code });
    if (!res.ok) throw new Error(res.message || 'Test failed.');
    show('Test sent to ' + res.sent + ' device(s). It should arrive in a few seconds.', 'ok');
  } catch (e) { show(e.message || String(e), 'err'); }
  finally { btn.disabled = false; }
}

$('enableBtn').onclick = enable;
$('testBtn').onclick = test;

/* come back later: restore the form and quietly refresh this device's token */
(async function init() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) {}
  if (saved) { $('email').value = saved.email; $('code').value = saved.code; }
  if (!configured()) return show('Not configured yet. Paste your Firebase and Apps Script values at the top of index.html.', 'info');
  if (saved && 'Notification' in window && Notification.permission === 'granted') {
    try {
      const token = await getToken();
      const res = await gas({ action: 'registerToken', email: saved.email, code: saved.code, token, device: deviceName() });
      show(res.ok ? 'This device is registered for ' + saved.email + '.' : (res.message || ''), res.ok ? 'ok' : 'err');
    } catch (e) { /* stay quiet */ }
  }
})();
</script>
